spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
      - id: identity-service
        uri: http://localhost:8080
        predicates:
          - Path=${app.api-prefix}/identity/**
        filters:
          - StripPrefix=1 # Cắt bỏ 1 segment đầu tiên của URL trước khi forward request.
            # Ví dụ:
            # Client gọi:  /api/identity/users
            # Gateway gửi service: /identity/users
            # tạo sự thống nhất, độc lập và hỗ trợ thay đổi version nếu có

      - id: profile-service
        uri: http://localhost:8081
        predicates:
          - Path=${app.api-prefix}/profile/users/** # exclude /internal
        filters:
          - StripPrefix=1
      - id: notification-service
        uri: http://localhost:8082
        predicates:
          - Path=${app.api-prefix}/notification/**
        filters:
          - StripPrefix=1


app:
  api-prefix: /api

server:
  port: 8888



