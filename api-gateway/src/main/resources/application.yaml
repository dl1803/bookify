spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
      - id: identity-service
        uri: http://localhost:8080
        predicates:
          - Path=${app.api-prefix}/identity/**
        filters:
          - StripPrefix=2 # Cắt bỏ 2 segment đầu tiên của URL trước khi forward request.
            # Ví dụ:
            # Client gọi:  /api/v1/identity/users
            # Gateway gửi service: /identity/users
            # tạo sự thống nhất, độc lập và hỗ trợ thay đổi version nếu có

      - id: profile-service
        uri: http://localhost:8081
        predicates:
          - Path=${app.api-prefix}/profile/users/** # exclude /internal
        filters:
          - StripPrefix=2

      - id: profile-swagger-ui
        uri: http://localhost:8081
        predicates:
          - Path=${app.api-prefix}/profile/swagger-ui/**
        filters:
          - StripPrefix=2

      - id: profile-api-docs
        uri: http://localhost:8081
        predicates:
          - Path=${app.api-prefix}/profile/v3/api-docs/**
        filters:
          - StripPrefix=2

      - id: notification-service
        uri: http://localhost:8082
        predicates:
          - Path=${app.api-prefix}/notification/**
        filters:
          - StripPrefix=2

      - id: post-service
        uri: http://localhost:8083
        predicates:
          - Path=${app.api-prefix}/post/**
        filters:
          - StripPrefix=2
      - id: file_service
        uri: http://localhost:8084
        predicates:
          - Path=${app.api-prefix}/file/**
        filters:
          - StripPrefix=2
      - id: chat_service
        uri: http://localhost:8085
        predicates:
          - Path=${app.api-prefix}/chat/**
        filters:
          - StripPrefix=2



app:
  api-prefix: /api/v1

server:
  port: 8888

springdoc:
  swagger-ui:
    urls:
      - name: Identity Service
        url: /api/v1/identity/v3/api-docs

      - name: Profile Service
        url: /api/v1/profile/v3/api-docs

      - name: Notification Service
        url: /api/v1/notification/v3/api-docs

      - name: Post Service
        url: /api/v1/post/v3/api-docs

      - name: File Service
        url: /api/v1/file/v3/api-docs

      - name: Chat Service
        url: /api/v1/chat/v3/api-docs
